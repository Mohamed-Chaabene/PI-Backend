spring.application.name=jobmatch
# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/jobmatch_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Exécute schema.sql après Hibernate pour corriger les types MySQL (VARCHAR vs ENUM trop court)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== SERVER =====
server.port=8080

# ===== LOGGING =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# ===== AI QUESTION GENERATOR =====
ai.generator.base-url=http://localhost:8000
ai.generator.generate-path=/generate